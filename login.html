  <!-- Password Toggle Script -->
  <script>
    function addPasswordToggles() {
      const passwordInputs = document.querySelectorAll('input[type="password"]');
      
      passwordInputs.forEach(input => {
        // Skip if toggle already added
        if (input.dataset.toggleAdded) return;
        
        // Mark as processed
        input.dataset.toggleAdded = 'true';
        
        // Ensure parent is positioned
        const parent = input.parentElement;
        if (window.getComputedStyle(parent).position === 'static') {
          parent.style.position = 'relative';
        }
        
        // Create toggle button
        const toggleBtn = document.createElement('button');
        toggleBtn.type = 'button';
        toggleBtn.className = 'password-toggle';
        toggleBtn.innerHTML = `
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
          </svg>
        `;
        
        // Style the button
        Object.assign(toggleBtn.style, {
          position: 'absolute',
          right: '12px',
          top: '50%',
          transform: 'translateY(-50%)',
          background: 'none',
          border: 'none',
          color: '#94a3b8',
          cursor: 'pointer',
          padding: '4px',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          width: '28px',
          height: '28px',
          zIndex: '10',
          transition: 'color 0.2s'
        });
        
        // Toggle functionality
        toggleBtn.addEventListener('click', (e) => {
          e.preventDefault();
          
          if (input.type === 'password') {
            input.type = 'text';
            toggleBtn.innerHTML = `
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
              </svg>
            `;
          } else {
            input.type = 'password';
            toggleBtn.innerHTML = `
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            `;
          }
        });
        
        // Hover effect
        toggleBtn.addEventListener('mouseenter', () => {
          toggleBtn.style.color = '#fff';
        });
        toggleBtn.addEventListener('mouseleave', () => {
          toggleBtn.style.color = '#94a3b8';
        });
        
        // Add padding to input
        input.style.paddingRight = '45px';
        input.style.position = 'relative';
        input.style.zIndex = '1';
        
        // Append button
        parent.appendChild(toggleBtn);
      });
    }
    
    // Try immediately
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', addPasswordToggles);
    } else {
      addPasswordToggles();
    }
    
    // Also try after delay for React
    setTimeout(addPasswordToggles, 1000);
    setTimeout(addPasswordToggles, 2000);
    
    // Use MutationObserver for dynamic content
    const observer = new MutationObserver(addPasswordToggles);
    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  </script>
