<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Infocera IT</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0a1628; color: #fff; min-height: 100vh; padding: 40px 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 50px; }
    .header h1 { font-size: 2.5rem; color: #2563eb; margin-bottom: 10px; }
    .header p { color: #94a3b8; font-size: 1.1rem; }
    .card { background: #111c32; border: 1px solid #1e293b; border-radius: 16px; padding: 40px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: #cbd5e1; font-size: 14px; font-weight: 500; }
    input, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 14px; font-family: inherit; }
    input:focus, textarea:focus { outline: none; border-color: #2563eb; }
    textarea { min-height: 120px; resize: vertical; }
    .btn { width: 100%; padding: 14px; background: linear-gradient(to right, #2563eb, #9333ea); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .message { padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
    .success { background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #10b981; }
    .error { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; }
    .hidden { display: none; }
    .back-link { display: inline-block; margin-bottom: 20px; color: #2563eb; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
    @media (max-width: 768px) {
      .form-row { grid-template-columns: 1fr; }
      .header h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">← Back to Home</a>
    
    <div class="header">
      <h1>Get in Touch</h1>
      <p>We'd love to hear from you. Send us a message and we'll respond as soon as possible.</p>
    </div>
    
    <div class="card">
      <div id="message" class="message hidden"></div>
      
      <form id="contactForm">
        <div class="form-row">
          <div class="form-group">
            <label>First Name *</label>
            <input type="text" id="firstName" required placeholder="John">
          </div>
          <div class="form-group">
            <label>Last Name *</label>
            <input type="text" id="lastName" required placeholder="Doe">
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Email *</label>
            <input type="email" id="email" required placeholder="john@example.com">
          </div>
          <div class="form-group">
            <label>Phone *</label>
            <input type="tel" id="phone" required placeholder="+91-9999999999">
          </div>
        </div>
        
        <div class="form-group">
          <label>Company (Optional)</label>
          <input type="text" id="company" placeholder="Your Company Name">
        </div>
        
        <div class="form-group">
          <label>Subject (Optional)</label>
          <input type="text" id="subject" placeholder="How can we help you?">
        </div>
        
        <div class="form-group">
          <label>Message *</label>
          <textarea id="message-text" required placeholder="Tell us about your project or inquiry..."></textarea>
        </div>
        
        <button type="submit" class="btn" id="submitBtn">Send Message</button>
      </form>
    </div>
  </div>

  <script src="assets/api-client.js"></script>
  <script>
    const form = document.getElementById('contactForm');
    const messageDiv = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');
    
    function showMessage(text, type) {
      messageDiv.textContent = text;
      messageDiv.className = `message ${type}`;
      messageDiv.classList.remove('hidden');
      
      // Scroll to message
      messageDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    
    function hideMessage() {
      messageDiv.classList.add('hidden');
    }
    
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      hideMessage();
      
      const formData = {
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        company: document.getElementById('company').value,
        subject: document.getElementById('subject').value,
        message: document.getElementById('message-text').value
      };
      
      try {
        const result = await window.API.contact.submit(formData);
        showMessage('✅ Thank you! Your message has been sent successfully. We\'ll get back to you soon.', 'success');
        form.reset();
        
        // Redirect to home after 3 seconds
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 3000);
      } catch (error) {
        showMessage('❌ ' + error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Message';
      }
    });
  </script>
</body>
</html>
