services:
  - type: web
    name: infocera-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://live-project-infocera-redesign.vercel.app
      - key: VERCEL_URL
        value: https://live-project-infocera-redesign.vercel.app
